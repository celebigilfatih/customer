version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: musteri_takip_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: musteri_takip
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: musteri_takip_app
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/musteri_takip
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: